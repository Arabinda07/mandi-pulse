name: Spec Kit & Constitutional Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-audit:
    name: Spec Kit & Constitutional Invariant Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Audit Spec Kit Structure & Constitution
        run: |
          python scripts/spec_audit.py

      - name: Run Test Suite
        run: |
          pytest -v
