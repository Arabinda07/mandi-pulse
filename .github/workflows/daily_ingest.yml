name: Daily Mandi Ingestion & Volatility Engine

on:
  schedule:
    # Runs daily at 06:30 UTC (12:00 PM IST)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI

permissions:
  contents: write

jobs:
  ingest_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Ingestion & Attribution Job
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python scripts/daily_job.py

      - name: Run Integrity Test Suite
        run: |
          python -m pytest tests/ -q

      - name: Sync Static Frontend Fallback
        run: |
          python scripts/export_fallback.py

      - name: Commit and Push Updated Warehouse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agri_engine.db frontend/src/api/fallbackData.js
          
          # Only commit if database or fallback data changed
          if git diff --staged --quiet; then
            echo "No changes in database to commit."
          else
            git commit -m "chore(data): automated daily mandi ingestion [$(date +'%Y-%m-%d')] [skip ci]"
            git push
          fi
